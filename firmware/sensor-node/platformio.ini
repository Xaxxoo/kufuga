[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  adafruit/DHT sensor library@^1.4.6
  vshymanskyy/TinyGSM@^0.12.0
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7.3.0
build_flags =
  -D TINY_GSM_MODEM_SIM800
  -D KU_DEFAULT_DEVICE_ID=\"kufuga-esp32-001\"
  -D KU_MQTT_HOST=\"192.168.4.2\"
  -D KU_MQTT_PORT=1883
  -D KU_MQTT_USERNAME=\"device-user\"
  -D KU_MQTT_PASSWORD=\"device-password\"
  -D KU_APN=\"internet\"
  -D KU_BIRD_TYPE_BROILER
  -D KU_BIRD_AGE_WEEKS=1
