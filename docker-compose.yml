services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - '1883:1883'
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kufuga
      POSTGRES_USER: kufuga
      POSTGRES_PASSWORD: kufuga
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kufuga -d kufuga']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mosquitto_data:
  mosquitto_log:
  postgres_data:
